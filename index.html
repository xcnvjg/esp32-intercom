<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ESP32 远程对讲终端 (v2.4 零回声版)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #0b0f17;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px;
      overflow: hidden;
    }
    .header { width: 100%; max-width: 420px; text-align: center; }
    .title { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
    .ver-tag { font-size: 11px; color: #10b981; margin-bottom: 6px; font-weight: 500; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .dot.online { background: #10b981; box-shadow: 0 0 10px #10b981; }

    .room-bar {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .room-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 7px 12px;
      color: #fff;
      font-size: 14px;
      text-align: center;
      width: 140px;
      outline: none;
    }
    .btn-connect {
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .main-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      position: relative;
    }

    .state-hint {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
      min-height: 22px;
      text-align: center;
    }

    .vu-meter-wrap {
      width: 140px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .vu-meter-bar {
      height: 100%;
      width: 0%;
      background: #10b981;
      border-radius: 3px;
      transition: width 0.05s linear;
    }

    .ptt-btn-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ripple {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.3);
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .ptt-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #3b82f6;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      touch-action: none;
      transition: all 0.15s ease;
      z-index: 2;
    }
    .ptt-btn.active {
      transform: scale(0.94);
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-color: #f87171;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
    }
    .ptt-btn.active + .ripple {
      opacity: 1;
      transform: scale(1.35);
      animation: pulse 1s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1.2); opacity: 0.5; }
      100% { transform: scale(1.45); opacity: 0.15; }
    }

    .mic-icon { width: 38px; height: 38px; fill: #3b82f6; transition: fill 0.15s; }
    .ptt-btn.active .mic-icon { fill: #ffffff; }
    .btn-label { font-size: 14px; font-weight: 600; color: #cbd5e1; }
    .ptt-btn.active .btn-label { color: #ffffff; }

    .footer {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #64748b;
    }
    .footer span b { color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">ESP32 广域网远程对讲</div>
    <div class="ver-tag">● 引擎: v2.4 (零回环隔离版)</div>
    <div class="badge">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">正在连接公网中继...</span>
    </div>

    <div class="room-bar">
      <input type="text" id="roomInput" class="room-input" placeholder="输入房间号" value="room101">
      <button id="connectBtn" class="btn-connect">切换房间</button>
    </div>
  </div>

  <div class="main-stage">
    <div id="stateHint" class="state-hint">等待对端设备加入房间...</div>
    <div class="vu-meter-wrap">
      <div id="vuMeter" class="vu-meter-bar"></div>
    </div>

    <div class="ptt-btn-wrapper">
      <div id="pttButton" class="ptt-btn">
        <svg class="mic-icon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <span id="pttText" class="btn-label">按住说话</span>
      </div>
      <div class="ripple"></div>
    </div>
  </div>

  <div class="footer">
    <span id="peerCount">对端在线: <b>0</b> 台</span>
    <span id="audioStats">链路: <b>16kHz 纯净互斥对讲</b></span>
  </div>

  <script>
    // 随机客户端 ID (4 字符，如 "8e38")
    window.myClientId = Math.random().toString(16).substring(2, 6);
    window.mqttClient = null;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    let muteNode = null; // 关键：静音增益节点，阻断麦克风声音回流扬声器
    let isTalking = false;
    let heartbeatTimer = null;
    let activePeers = new Map();

    const MAGIC_0 = 0x49; // 'I'
    const MAGIC_1 = 0x43; // 'C'
    const HEADER_LEN = 8;

    const TARGET_SAMPLE_RATE = 16000;
    const CHUNK_SAMPLES = 2560; // 160ms 黄金抗限流步长
    let pcmAccumulator = new Int16Array(CHUNK_SAMPLES);
    let pcmAccCount = 0;
    let resamplePhase = 0.0;

    // 弹性 Jitter Buffer (防抖水库)
    let nextPlayTime = 0;
    const JITTER_BUFFER_LEAD = 0.25;

    let currentVolLevel = 0;
    let animFrameReq = null;

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const stateHint = document.getElementById("stateHint");
    const roomInput = document.getElementById("roomInput");
    const connectBtn = document.getElementById("connectBtn");
    const pttButton = document.getElementById("pttButton");
    const pttText = document.getElementById("pttText");
    const peerCount = document.getElementById("peerCount");
    const vuMeter = document.getElementById("vuMeter");

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startVuAnimation() {
      if (!animFrameReq) {
        const update = () => {
          vuMeter.style.width = Math.min(100, currentVolLevel * 100) + "%";
          currentVolLevel *= 0.85;
          animFrameReq = requestAnimationFrame(update);
        };
        animFrameReq = requestAnimationFrame(update);
      }
    }

    function getAudioTopic(room) {
      return "esp32_intercom_v2/" + room + "/audio";
    }

    function getPresenceTopic(room) {
      return "esp32_intercom_v2/" + room + "/presence";
    }

    function connect() {
      const room = roomInput.value.trim() || "room101";
      const audioTopic = getAudioTopic(room);
      const presenceTopic = getPresenceTopic(room);

      if (window.mqttClient) {
        clearInterval(heartbeatTimer);
        window.mqttClient.end(true);
      }

      activePeers.clear();
      updatePeerDisplay();

      statusText.innerText = "正在连接中继...";
      statusDot.className = "dot";

      const brokerUrl = "wss://broker.emqx.io:8084/mqtt";
      window.mqttClient = mqtt.connect(brokerUrl, {
        clientId: "mob_" + window.myClientId + "_" + Math.random().toString(16).substring(2, 6),
        clean: true,
        connectTimeout: 5000,
        keepalive: 30
      });

      window.mqttClient.on("connect", function() {
        statusText.innerText = "已进入房间: " + room;
        statusDot.className = "dot online";
        stateHint.innerText = "通道已就绪，按住按钮即可说话";

        window.mqttClient.subscribe([audioTopic, presenceTopic], { qos: 0 });

        sendHeartbeat(presenceTopic);
        heartbeatTimer = setInterval(function() {
          sendHeartbeat(presenceTopic);
          checkPeerExpiry();
        }, 2500);
      });

      window.mqttClient.on("offline", function() {
        statusText.innerText = "网络离线中...";
        statusDot.className = "dot";
      });

      window.mqttClient.on("message", function(topic, message) {
        if (topic === presenceTopic) {
          try {
            const data = JSON.parse(message.toString());
            if (data.id && data.id !== window.myClientId) {
              activePeers.set(data.id, Date.now());
              updatePeerDisplay();
            }
          } catch (e) {}
        } else if (topic === audioTopic) {
          // 双重保险 1：当自己正在说话时，扬声器绝对静音，不播放任何外部/回环声音
          if (isTalking) return;

          if (message.length > HEADER_LEN && message[0] === MAGIC_0 && message[1] === MAGIC_1) {
            const senderId = new TextDecoder().decode(message.subarray(2, 6));
            // 双重保险 2：发包者是自己时，坚决丢弃，杜绝回环
            if (senderId !== window.myClientId) {
              playPcmBuffer(message.subarray(HEADER_LEN));
            }
          }
        }
      });
    }

    function sendHeartbeat(presenceTopic) {
      if (window.mqttClient && window.mqttClient.connected) {
        const payload = JSON.stringify({ id: window.myClientId, t: Date.now() });
        window.mqttClient.publish(presenceTopic, payload, { qos: 0 });
      }
    }

    function checkPeerExpiry() {
      const now = Date.now();
      for (const [id, lastTime] of activePeers.entries()) {
        if (now - lastTime > 6000) {
          activePeers.delete(id);
        }
      }
      updatePeerDisplay();
    }

    function updatePeerDisplay() {
      const count = activePeers.size;
      peerCount.innerHTML = "对端在线: <b>" + count + "</b> 台";
      if (count > 0) {
        stateHint.innerText = "🟢 对端设备在线，随时可对讲！";
      } else {
        stateHint.innerText = "等待对端设备加入相同房间...";
      }
    }

    // ==========================================
    // 弹性 Jitter Buffer (消除突发延迟与断续)
    // ==========================================
    function playPcmBuffer(uint8Bytes) {
      if (!audioCtx) initAudioContext();
      if (uint8Bytes.length < 2) return;

      const copy = new Uint8Array(uint8Bytes.length);
      copy.set(uint8Bytes);
      const int16Array = new Int16Array(copy.buffer);
      const float32Array = new Float32Array(int16Array.length);

      let peak = 0;
      for (let i = 0; i < int16Array.length; i++) {
        let val = int16Array[i];
        let abs = Math.abs(val);
        if (abs > peak) peak = abs;
        float32Array[i] = val / 32768.0;
      }

      currentVolLevel = Math.max(currentVolLevel, peak / 16000.0);

      const audioBuffer = audioCtx.createBuffer(1, float32Array.length, TARGET_SAMPLE_RATE);
      audioBuffer.getChannelData(0).set(float32Array);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (nextPlayTime < now) {
        nextPlayTime = now + JITTER_BUFFER_LEAD;
      }

      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    }

    // ==========================================
    // 麦克风采音：通过增益为 0 的静音节点阻断本地回音
    // ==========================================
    async function startRecording() {
      initAudioContext();
      startVuAnimation();

      if (!window.mqttClient || !window.mqttClient.connected) {
        alert("尚未连接到公网中继，请稍候...");
        return;
      }

      const room = roomInput.value.trim() || "room101";
      const audioTopic = getAudioTopic(room);
      pcmAccCount = 0;
      resamplePhase = 0.0;

      try {
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
        }

        const source = audioCtx.createMediaStreamSource(micStream);
        const actualRate = audioCtx.sampleRate;
        const step = actualRate / TARGET_SAMPLE_RATE;

        scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);

        // 核心消除自己声音的关键：静音增益节点 (Gain = 0)
        // 既保持 ScriptProcessor 能够正常回调，又彻底切断向本地扬声器的音频通路！
        if (!muteNode) {
          muteNode = audioCtx.createGain();
          muteNode.gain.value = 0.0; // 彻底无声
          muteNode.connect(audioCtx.destination);
        }

        scriptNode.onaudioprocess = function(e) {
          if (!isTalking || !window.mqttClient || !window.mqttClient.connected) return;
          const input = e.inputBuffer.getChannelData(0);

          let peak = 0;
          let inLen = input.length;
          let idx = resamplePhase;

          while (idx < inLen - 1) {
            let i0 = Math.floor(idx);
            let frac = idx - i0;
            let sample = input[i0] * (1 - frac) + input[i0 + 1] * frac;

            let abs = Math.abs(sample);
            if (abs > peak) peak = abs;

            let pcmVal = sample < 0 ? (sample * 32768) : (sample * 32767);
            pcmAccumulator[pcmAccCount++] = Math.max(-32768, Math.min(32767, pcmVal | 0));

            if (pcmAccCount >= CHUNK_SAMPLES) {
              sendChunk(audioTopic);
              pcmAccCount = 0;
            }

            idx += step;
          }

          resamplePhase = idx - inLen;
          currentVolLevel = Math.max(currentVolLevel, peak * 1.5);
        };

        // 连入静音节点，杜绝任何本地监听回声
        source.connect(scriptNode);
        scriptNode.connect(muteNode);

        isTalking = true;
        pttButton.classList.add("active");
        pttText.innerText = "正在发话...";
        stateHint.innerText = "正在讲话，松开发送完毕";
      } catch (err) {
        alert("获取麦克风权限失败: " + err.message);
      }
    }

    function sendChunk(audioTopic) {
      const packet = new Uint8Array(HEADER_LEN + pcmAccumulator.byteLength);
      packet[0] = MAGIC_0;
      packet[1] = MAGIC_1;
      const idBytes = new TextEncoder().encode(window.myClientId.substring(0, 4));
      packet.set(idBytes, 2);
      packet.set(new Uint8Array(pcmAccumulator.buffer), HEADER_LEN);

      window.mqttClient.publish(audioTopic, packet, { qos: 0 });
    }

    function stopRecording() {
      if (!isTalking) return;
      isTalking = false;
      pttButton.classList.remove("active");
      pttText.innerText = "按住说话";
      stateHint.innerText = "松开完毕，等待对端发话";

      if (pcmAccCount > 0 && window.mqttClient && window.mqttClient.connected) {
        const room = roomInput.value.trim() || "room101";
        const audioTopic = getAudioTopic(room);
        const tail = pcmAccumulator.slice(0, pcmAccCount);

        const packet = new Uint8Array(HEADER_LEN + tail.byteLength);
        packet[0] = MAGIC_0;
        packet[1] = MAGIC_1;
        const idBytes = new TextEncoder().encode(window.myClientId.substring(0, 4));
        packet.set(idBytes, 2);
        packet.set(new Uint8Array(tail.buffer), HEADER_LEN);

        window.mqttClient.publish(audioTopic, packet, { qos: 0 });
        pcmAccCount = 0;
      }

      if (scriptNode) {
        scriptNode.disconnect();
        scriptNode = null;
      }
    }

    pttButton.addEventListener("mousedown", function(e) { e.preventDefault(); startRecording(); });
    window.addEventListener("mouseup", function(e) { stopRecording(); });

    pttButton.addEventListener("touchstart", function(e) { e.preventDefault(); startRecording(); }, { passive: false });
    window.addEventListener("touchend", function(e) { stopRecording(); });
    window.addEventListener("touchcancel", function(e) { stopRecording(); });

    connectBtn.addEventListener("click", function() {
      connect();
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("room")) {
      roomInput.value = urlParams.get("room");
    }

    window.addEventListener("DOMContentLoaded", function() {
      connect();
    });
  </script>
</body>
</html>
